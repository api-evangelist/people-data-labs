naftiko: 1.0.0-alpha2
info:
  label: People Data Labs API — Jobs
  description: 'People Data Labs API — Jobs. 1 operations. Lead operation: Search job postings. Self-contained Naftiko capability
    covering one People Data Labs business surface.'
  tags:
  - People Data Labs
  - Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PEOPLE_DATA_LABS_API_KEY: PEOPLE_DATA_LABS_API_KEY
capability:
  consumes:
  - type: http
    namespace: people-data-labs-jobs
    baseUri: https://api.peopledatalabs.com/v5
    description: People Data Labs API — Jobs business capability. Self-contained, no shared references.
    resources:
    - name: job_posting-search
      path: /job_posting/search
      operations:
      - name: get
        method: GET
        description: Search job postings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sql
          in: query
          type: string
        - name: query
          in: query
          type: string
        - name: size
          in: query
          type: integer
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.PEOPLE_DATA_LABS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: people-data-labs-jobs-rest
    port: 8080
    description: REST adapter for People Data Labs API — Jobs. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/job-posting/search
      name: job-posting-search
      description: REST surface for job_posting-search.
      operations:
      - method: GET
        name: get
        description: Search job postings
        call: people-data-labs-jobs.get
        with:
          sql: rest.sql
          query: rest.query
          size: rest.size
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: people-data-labs-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for People Data Labs API — Jobs. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: search-job-postings
      description: Search job postings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: people-data-labs-jobs.get
      with:
        sql: tools.sql
        query: tools.query
        size: tools.size
      outputParameters:
      - type: object
        mapping: $.
