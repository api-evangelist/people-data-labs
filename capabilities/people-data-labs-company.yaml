naftiko: 1.0.0-alpha2
info:
  label: People Data Labs API — Company
  description: 'People Data Labs API — Company. 2 operations. Lead operation: Enrich a company profile. Self-contained Naftiko
    capability covering one People Data Labs business surface.'
  tags:
  - People Data Labs
  - Company
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PEOPLE_DATA_LABS_API_KEY: PEOPLE_DATA_LABS_API_KEY
capability:
  consumes:
  - type: http
    namespace: people-data-labs-company
    baseUri: https://api.peopledatalabs.com/v5
    description: People Data Labs API — Company business capability. Self-contained, no shared references.
    resources:
    - name: company-enrich
      path: /company/enrich
      operations:
      - name: get
        method: GET
        description: Enrich a company profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
        - name: website
          in: query
          type: string
        - name: profile
          in: query
          type: string
        - name: ticker
          in: query
          type: string
        - name: location
          in: query
          type: string
    - name: company-search
      path: /company/search
      operations:
      - name: get
        method: GET
        description: Search for companies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sql
          in: query
          type: string
        - name: query
          in: query
          type: string
        - name: size
          in: query
          type: integer
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.PEOPLE_DATA_LABS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: people-data-labs-company-rest
    port: 8080
    description: REST adapter for People Data Labs API — Company. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/company/enrich
      name: company-enrich
      description: REST surface for company-enrich.
      operations:
      - method: GET
        name: get
        description: Enrich a company profile
        call: people-data-labs-company.get
        with:
          name: rest.name
          website: rest.website
          profile: rest.profile
          ticker: rest.ticker
          location: rest.location
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company/search
      name: company-search
      description: REST surface for company-search.
      operations:
      - method: GET
        name: get
        description: Search for companies
        call: people-data-labs-company.get
        with:
          sql: rest.sql
          query: rest.query
          size: rest.size
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: people-data-labs-company-mcp
    port: 9090
    transport: http
    description: MCP adapter for People Data Labs API — Company. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: enrich-company-profile
      description: Enrich a company profile
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: people-data-labs-company.get
      with:
        name: tools.name
        website: tools.website
        profile: tools.profile
        ticker: tools.ticker
        location: tools.location
      outputParameters:
      - type: object
        mapping: $.
    - name: search-companies
      description: Search for companies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: people-data-labs-company.get
      with:
        sql: tools.sql
        query: tools.query
        size: tools.size
      outputParameters:
      - type: object
        mapping: $.
