naftiko: 1.0.0-alpha2
info:
  label: People Data Labs API
  description: People Data Labs (PDL) provides APIs for enriching and building people and company profiles at scale. The API
    offers person enrichment, person search, person identification, company enrichment, company search, IP enrichment, and
    job posting search across a dataset of professional profiles and organizations.
  tags:
  - People
  - Data
  - Labs
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: people-data-labs
    baseUri: https://api.peopledatalabs.com/v5
    description: People Data Labs API HTTP API.
    authentication:
      type: apikey
      in: header
      name: X-API-Key
      value: '{{PEOPLE_DATA_LABS_TOKEN}}'
    resources:
    - name: person-enrich
      path: /person/enrich
      operations:
      - name: get-person-enrich
        method: GET
        description: Enrich a person profile
        inputParameters:
        - name: email
          in: query
          type: string
        - name: phone
          in: query
          type: string
        - name: profile
          in: query
          type: string
        - name: first_name
          in: query
          type: string
        - name: last_name
          in: query
          type: string
        - name: company
          in: query
          type: string
        - name: min_likelihood
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: person-search
      path: /person/search
      operations:
      - name: get-person-search
        method: GET
        description: Search for person profiles
        inputParameters:
        - name: sql
          in: query
          type: string
        - name: query
          in: query
          type: string
        - name: size
          in: query
          type: integer
        - name: from
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: person-identify
      path: /person/identify
      operations:
      - name: get-person-identify
        method: GET
        description: Identify a person
        inputParameters:
        - name: email
          in: query
          type: string
        - name: phone
          in: query
          type: string
        - name: first_name
          in: query
          type: string
        - name: last_name
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: person-bulk
      path: /person/bulk
      operations:
      - name: post-person-bulk
        method: POST
        description: Bulk person enrichment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: company-enrich
      path: /company/enrich
      operations:
      - name: get-company-enrich
        method: GET
        description: Enrich a company profile
        inputParameters:
        - name: name
          in: query
          type: string
        - name: website
          in: query
          type: string
        - name: profile
          in: query
          type: string
        - name: ticker
          in: query
          type: string
        - name: location
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: company-search
      path: /company/search
      operations:
      - name: get-company-search
        method: GET
        description: Search for companies
        inputParameters:
        - name: sql
          in: query
          type: string
        - name: query
          in: query
          type: string
        - name: size
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ip-enrich
      path: /ip/enrich
      operations:
      - name: get-ip-enrich
        method: GET
        description: IP enrichment
        inputParameters:
        - name: ip
          in: query
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: job-posting-search
      path: /job_posting/search
      operations:
      - name: get-job-posting-search
        method: GET
        description: Search job postings
        inputParameters:
        - name: sql
          in: query
          type: string
        - name: query
          in: query
          type: string
        - name: size
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: autocomplete
      path: /autocomplete
      operations:
      - name: get-autocomplete
        method: GET
        description: Autocomplete suggestions
        inputParameters:
        - name: field
          in: query
          type: string
          required: true
        - name: text
          in: query
          type: string
        - name: size
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: people-data-labs-rest
    description: REST adapter for People Data Labs API.
    resources:
    - path: /person/enrich
      name: get-person-enrich
      operations:
      - method: GET
        name: get-person-enrich
        description: Enrich a person profile
        call: people-data-labs.get-person-enrich
        outputParameters:
        - type: object
          mapping: $.
    - path: /person/search
      name: get-person-search
      operations:
      - method: GET
        name: get-person-search
        description: Search for person profiles
        call: people-data-labs.get-person-search
        outputParameters:
        - type: object
          mapping: $.
    - path: /person/identify
      name: get-person-identify
      operations:
      - method: GET
        name: get-person-identify
        description: Identify a person
        call: people-data-labs.get-person-identify
        outputParameters:
        - type: object
          mapping: $.
    - path: /person/bulk
      name: post-person-bulk
      operations:
      - method: POST
        name: post-person-bulk
        description: Bulk person enrichment
        call: people-data-labs.post-person-bulk
        outputParameters:
        - type: object
          mapping: $.
    - path: /company/enrich
      name: get-company-enrich
      operations:
      - method: GET
        name: get-company-enrich
        description: Enrich a company profile
        call: people-data-labs.get-company-enrich
        outputParameters:
        - type: object
          mapping: $.
    - path: /company/search
      name: get-company-search
      operations:
      - method: GET
        name: get-company-search
        description: Search for companies
        call: people-data-labs.get-company-search
        outputParameters:
        - type: object
          mapping: $.
    - path: /ip/enrich
      name: get-ip-enrich
      operations:
      - method: GET
        name: get-ip-enrich
        description: IP enrichment
        call: people-data-labs.get-ip-enrich
        outputParameters:
        - type: object
          mapping: $.
    - path: /job_posting/search
      name: get-job-posting-search
      operations:
      - method: GET
        name: get-job-posting-search
        description: Search job postings
        call: people-data-labs.get-job-posting-search
        outputParameters:
        - type: object
          mapping: $.
    - path: /autocomplete
      name: get-autocomplete
      operations:
      - method: GET
        name: get-autocomplete
        description: Autocomplete suggestions
        call: people-data-labs.get-autocomplete
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: people-data-labs-mcp
    transport: http
    description: MCP adapter for People Data Labs API for AI agent use.
    tools:
